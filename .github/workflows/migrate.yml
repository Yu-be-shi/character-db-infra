name: Database Migration

on:
  pull_request:
    paths:
      - 'terraform/**'

  # 本番(AWS)への適用は使い捨て運用。RDS の構築/削除は api-infra の prod-switch.yml(up/down)が行う。
  # ここは PR 時の検証と、手動のマイグレーション再実行のみ（main への push では AWS を一切触らない）。
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-1
  TF_WORKING_DIR: terraform/environments/prod

jobs:
  # ─── PR: マイグレーション構文・整合性チェック ──────────────────────────
  validate-migration:
    name: Validate migration SQL
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: characters_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: testpassword
        # --network host のコンテナから localhost:5432 で到達できるよう公開する
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d characters_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # private リポジトリの cross-checkout にはデフォルト GITHUB_TOKEN では権限が
      # 足りないため PAT を使う（prod-switch.yml と同じ方式）。
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/character-db
          path: db
          ref: main
          token: ${{ secrets.GH_PAT }}

      - name: Validate atlas.sum integrity
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/db/migrations:/migrations \
            arigaio/atlas:1.2.2 \
            migrate validate --dir "file:///migrations"

      # 安全リンタ（squawk・無料）。破壊的変更・ロック等を検出。除外ルールは db/squawk.toml。
      - name: Lint migration SQL (squawk)
        run: |
          docker run --rm -v ${{ github.workspace }}/db:/work -w /work node:20-slim \
            sh -c "npx --yes squawk-cli@2.57.0 -c squawk.toml migrations/*.sql views/*.sql seeds/*.sql"

      # 本番と同じ migrate イメージ（atlas apply → psql で views 適用 → psql で seeds 適用）を
      # ビルドしてテスト DB に適用し、テーブル・ビュー・初期データがすべて問題なく流れることを検証する。
      - name: Build migration image
        run: docker build -f db/Dockerfile.migrate -t cdb-migrate db/

      - name: Apply migrations + views + seeds against test DB
        run: |
          docker run --rm --network host cdb-migrate \
            "--url=postgres://app:testpassword@localhost:5432/characters_test?sslmode=disable"

  # ─── Terraform plan（PR時） ────────────────────────────────────────────
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # AWS 認証は OIDC（短命トークン）。長期アクセスキーは使わない。
    # https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-amazon-web-services
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # backend.tf は bucket を持たない部分設定のため、init 時に必ず注入する。
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      # 変数はすべて TF_VAR_* で渡す（prod.tfvars は gitignore されており
      # リポジトリに存在しないため -var-file は使えない）。
      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -no-color
        env:
          TF_VAR_vpc_id: ${{ secrets.TF_VAR_VPC_ID }}
          TF_VAR_private_subnet_ids: ${{ secrets.TF_VAR_PRIVATE_SUBNET_IDS }}
          TF_VAR_api_security_group_ids: ${{ secrets.TF_VAR_API_SG_IDS }}

  # ─── 本番マイグレーション実行（手動トリガー） ───────────────────────────
  # 本番 RDS が起動中（prod-switch up 済み）の状態で、スキーマを再適用したいときに手動実行する。
  run-migration:
    name: Run migration on production RDS
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # terraform output から SG ID とサブネットを動的取得（ハードコード不要）
      - name: Get infra outputs from Terraform state
        id: tf-output
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -reconfigure -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          echo "migration_sg=$(terraform output -raw migrate_security_group_id)" >> $GITHUB_OUTPUT
          echo "private_subnets=$(terraform output -json private_subnet_ids | jq -r 'join(",")')" >> $GITHUB_OUTPUT
        env:
          TF_VAR_vpc_id: ${{ secrets.TF_VAR_VPC_ID }}
          TF_VAR_private_subnet_ids: ${{ secrets.TF_VAR_PRIVATE_SUBNET_IDS }}
          TF_VAR_api_security_group_ids: ${{ secrets.TF_VAR_API_SG_IDS }}

      # 既存タスク定義のイメージは「前回 up 時点」のもの。スキーマ再適用の目的は
      # 新しいマイグレーションの反映なので、character-db@main を build → push し、
      # タスク定義が参照するタグ（latest ではなく SHA）を上書き登録してから実行する。
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/character-db
          path: db
          ref: main
          token: ${{ secrets.GH_PAT }}

      - name: Build & push latest migrate image
        id: image
        run: |
          set -euo pipefail
          REG="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REG"
          DB_SHA=$(git -C db rev-parse HEAD)
          IMAGE="$REG/character-db-migrate:$DB_SHA"
          if ! aws ecr describe-images --repository-name character-db-migrate --image-ids imageTag="$DB_SHA" >/dev/null 2>&1; then
            docker build -f db/Dockerfile.migrate -t "$IMAGE" db/
            docker push "$IMAGE"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Register task definition with new image
        id: taskdef
        run: |
          set -euo pipefail
          aws ecs describe-task-definition --task-definition character-db-migrate \
            --query 'taskDefinition' > td.json
          jq --arg img "${{ steps.image.outputs.image }}" \
            '.containerDefinitions[0].image = $img
             | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            td.json > td-new.json
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file://td-new.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$NEW_ARN" >> "$GITHUB_OUTPUT"

      - name: Run Atlas migrate apply via ECS task
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --task-definition "${{ steps.taskdef.outputs.arn }}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ steps.tf-output.outputs.private_subnets }}],securityGroups=[${{ steps.tf-output.outputs.migration_sg }}],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)

          echo "Migration task ARN: $TASK_ARN"
          aws ecs wait tasks-stopped \
            --cluster ${{ vars.ECS_CLUSTER }} --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ vars.ECS_CLUSTER }} --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)

          [ "$EXIT_CODE" = "0" ] || exit 1
